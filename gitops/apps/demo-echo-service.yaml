---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-service
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-service
  template:
    metadata:
      labels:
        app: echo-service
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: "80"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: echo-service
  namespace: demo
spec:
  selector:
    app: echo-service
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: batch/v1
kind: Job
metadata:
  name: consul-register-echo
  namespace: demo
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: consul-register
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              # 注册 echo-service 到 Consul
              curl -X PUT http://consul-server.consul.svc.cluster.local:8500/v1/agent/service/register \
                -H 'Content-Type: application/json' \
                -d '{
                  "ID": "echo-service-1",
                  "Name": "echo-service",
                  "Tags": ["api", "demo"],
                  "Address": "echo-service.demo.svc.cluster.local",
                  "Port": 80,
                  "Check": {
                    "HTTP": "http://echo-service.demo.svc.cluster.local:80/",
                    "Interval": "10s"
                  }
                }'
              
              # 注册第二个实例
              curl -X PUT http://consul-server.consul.svc.cluster.local:8500/v1/agent/service/register \
                -H 'Content-Type: application/json' \
                -d '{
                  "ID": "echo-service-2", 
                  "Name": "echo-service",
                  "Tags": ["api", "demo"],
                  "Address": "echo-service.demo.svc.cluster.local",
                  "Port": 80,
                  "Check": {
                    "HTTP": "http://echo-service.demo.svc.cluster.local:80/",
                    "Interval": "10s"
                  }
                }'
              
              echo "Services registered to Consul"