---
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migration
  namespace: kong
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h kong-postgresql -p 5432 -U kong; do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: kong-migration
          image: kong/kong-gateway:3.5.0.0
          envFrom:
            - configMapRef:
                name: kong-config
          command:
            - /bin/bash
            - -c
            - |
              kong migrations bootstrap
              kong migrations up
              kong migrations finish
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.5.157
  ports:
    - name: proxy
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: proxy-ssl
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app: kong
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong
  labels:
    app: kong
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.5.159
  ports:
    - name: admin
      port: 8001
      targetPort: 8001
    - name: admin-ssl
      port: 8444
      targetPort: 8444
    - name: manager
      port: 8002
      targetPort: 8002
  selector:
    app: kong
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong/kong-gateway:3.5.0.0
          envFrom:
            - configMapRef:
                name: kong-config
          env:
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP
            - name: proxy-ssl
              containerPort: 8443
              protocol: TCP
            - name: admin-api
              containerPort: 8001
              protocol: TCP
            - name: admin-gui
              containerPort: 8002
              protocol: TCP
          volumeMounts:
            - name: kong-config-volume
              mountPath: /kong
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: kong-config-volume
          configMap:
            name: kong-declarative-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: kong
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    
    services:
    - name: example-api
      url: http://httpbin.org
      routes:
      - name: example-route
        paths:
        - /httpbin
        strip_path: true
        
    upstreams:
    - name: consul-upstream
      algorithm: round-robin
      healthchecks:
        active:
          http_path: /
          healthy:
            interval: 10
            successes: 2
          unhealthy:
            interval: 10
            http_failures: 3