---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-config
  namespace: consul
data:
  server.json: |
    {
      "datacenter": "homelab",
      "data_dir": "/consul/data",
      "log_level": "INFO",
      "node_name": "consul-server",
      "bind_addr": "0.0.0.0",
      "client_addr": "0.0.0.0",
      "retry_join": [
        "consul-server-0.consul-server.consul.svc.cluster.local",
        "consul-server-1.consul-server.consul.svc.cluster.local",
        "consul-server-2.consul-server.consul.svc.cluster.local"
      ],
      "server": true,
      "bootstrap_expect": 3,
      "ui_config": {
        "enabled": true
      },
      "connect": {
        "enabled": true
      },
      "ports": {
        "grpc": 8502,
        "grpc_tls": 8503
      },
      "acl": {
        "enabled": false,
        "default_policy": "allow"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-agent-config
  namespace: consul
data:
  agent.json: |
    {
      "datacenter": "homelab",
      "data_dir": "/consul/data",
      "log_level": "INFO",
      "bind_addr": "0.0.0.0",
      "client_addr": "0.0.0.0",
      "retry_join": [
        "consul-server.consul.svc.cluster.local"
      ],
      "server": false,
      "ui_config": {
        "enabled": false
      },
      "connect": {
        "enabled": true
      },
      "ports": {
        "grpc": 8502
      },
      "services": {
        "name": "consul-agent",
        "tags": ["consul", "agent"],
        "port": 8301
      }
    }